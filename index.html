<!doctype html>
<html lang="de-CH">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SPHAIR Coach</title>
  <meta name="description" content="Lern-App für die SPHAIR-Vorbereitung – Ziel Airline-Cockpit">
  <meta name="theme-color" content="#2f5bea">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="SPHAIR Coach">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="top">
    <div class="brand"><img src="icons/icon.svg" alt="" width="28" height="28"><span>SPHAIR Coach</span></div>
    <div class="top-stats">
      <span class="pill streak" id="topStreak" title="Streak">🔥 0</span>
      <span class="pill xp" id="topXp" title="Erfahrungspunkte">⭐ 0</span>
    </div>
  </header>

  <main id="view" tabindex="-1"></main>

  <nav class="tabs" aria-label="Navigation">
    <a href="#heute" data-tab="heute"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg><span>Heute</span></a>
    <a href="#lernen" data-tab="lernen"><svg viewBox="0 0 24 24"><path d="M4 5a2 2 0 0 1 2-2h12v16H6a2 2 0 0 0-2 2zM4 21V5M8 7h6"/></svg><span>Lernen</span></a>
    <a href="#training" data-tab="training"><svg viewBox="0 0 24 24"><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/><circle cx="12" cy="12" r="5"/></svg><span>Training</span></a>
    <a href="#coach" data-tab="coach"><svg viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4z"/><path d="M9 10h.01M12 10h.01M15 10h.01"/></svg><span>Coach</span></a>
    <a href="#profil" data-tab="profil"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg><span>Profil</span></a>
  </nav>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/content.js"></script>
  <script src="js/checklists.js"></script>
  <script src="js/schule.js"></script>
  <script src="js/kontrollfragen.js"></script>
  <script src="js/lernplan.js"></script>
  <script src="js/trainers.js"></script>
  <script src="js/coach.js"></script>
  <script src="js/multitask.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
